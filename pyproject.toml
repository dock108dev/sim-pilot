[project]
name = "sim-pilot"
version = "0.1.0"
description = "A local runtime for validated actions against deterministic simulations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.0,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.408,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.14.0,<0.15.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
